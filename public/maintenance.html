<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>BibProfile — under maintenance</title>
  <style>
    :root { --fg:#1a1a1a; --muted:#666; --accent:#2b6cb0; --bg-alt:#f6f7f8; --line:#ddd; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg); background: var(--bg-alt); line-height: 1.5;
    }
    .box {
      max-width: 460px; width: 100%; text-align: center; background: #fff;
      border: 1px solid var(--line); border-radius: 14px; padding: 40px 32px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    .accent { height: 4px; width: 64px; background: var(--accent); border-radius: 999px; margin: 14px auto 20px; }
    p { color: var(--muted); margin: 0 0 10px; }
    .small { font-size: 0.85rem; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="box">
    <h1>BibProfile</h1>
    <div class="accent"></div>
    <p>BibProfile is temporarily down for maintenance.</p>
    <p>We&rsquo;ll be back shortly &mdash; please check back soon.</p>
    <p class="small">Thanks for your patience.</p>
  </main>
</body>
</html>
